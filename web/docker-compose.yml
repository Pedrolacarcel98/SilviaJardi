version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silviajardi-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # If you have environment variables, you can add them here or use an env_file
    # env_file:
    #   - .env.production
